<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="cd-version" content="__CD_VERSION__">
<title data-i18n="appName">__CD_NAME__</title>
<style>
/*INJECT_STYLES*/
</style>
</head>
<body>

<div class="cd-app">
  <header class="cd-topbar">
    <div>
      <h1 class="cd-title" data-i18n="appName"></h1>
      <p class="cd-sub" id="cdSub" data-i18n="loading"></p>
    </div>
    <div class="cd-actions">
      <button class="cd-icon-btn" id="cdSettings" type="button" aria-label="设置" title="设置"
              data-i18n-aria="settings" data-i18n-title="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/>
</svg>
      </button>
      <button class="cd-add" id="cdAdd" type="button" aria-label="添加事项" data-i18n-aria="addAria">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        <span data-i18n="add"></span>
      </button>
    </div>
  </header>

  <section id="cdHero" aria-live="polite"></section>

  <div class="cd-chips" id="cdChips" role="group" aria-label="筛选" data-i18n-aria="filterAria">
    <button type="button" class="cd-chip" data-f="all" aria-pressed="true" data-i18n="chip.all"></button>
    <button type="button" class="cd-chip" data-f="birthday" aria-pressed="false" data-i18n="chip.birthday"></button>
    <button type="button" class="cd-chip" data-f="anniversary" aria-pressed="false" data-i18n="chip.anniversary"></button>
    <button type="button" class="cd-chip" data-f="countdown" aria-pressed="false" data-i18n="chip.countdown"></button>
    <button type="button" class="cd-chip" data-f="festival" aria-pressed="false" data-i18n="chip.festival"></button>
    <button type="button" class="cd-chip" data-f="archive" aria-pressed="false" data-i18n="chip.archive"></button>
  </div>

  <main class="cd-list" id="cdList"></main>
</div>

<div id="cdLayer" hidden>
  <div class="cd-mask" id="cdMask"></div>
  <div class="cd-sheet" id="cdSheet" role="dialog" aria-modal="true" aria-labelledby="cdSheetTitle">
    <div class="cd-sheet-head">
      <button type="button" id="cdCancel" data-i18n="cancel"></button>
      <h2 id="cdSheetTitle" data-i18n="sheet.newDefault"></h2>
      <button type="button" class="cd-strong" id="cdSave" data-i18n="save"></button>
    </div>
    <div class="cd-sheet-body">

      <label class="cd-field" id="fTitleWrap">
        <span class="cd-label" data-i18n="form.name"></span>
        <input class="cd-input" id="fTitle" type="text" maxlength="40" placeholder=""
               data-i18n-ph="form.namePh" autocomplete="off">
      </label>

      <div class="cd-field">
        <span class="cd-label" data-i18n="form.kind"></span>
        <div class="cd-seg" id="fKind">
          <button type="button" data-v="birthday" data-i18n="kind.birthday"></button>
          <button type="button" data-v="anniversary" data-i18n="kind.anniversary"></button>
          <button type="button" data-v="countdown" data-i18n="kind.countdown"></button>
          <button type="button" data-v="festival" data-i18n="kind.festival"></button>
        </div>
      </div>

      <div class="cd-field" id="fPresetWrap" hidden>
        <span class="cd-label" data-i18n="form.preset"></span>
        <div class="cd-presets" id="fPresets"></div>
        <p class="cd-hint" id="fPresetHint" data-i18n="form.presetHint"></p>
      </div>

      <div class="cd-field" id="fCalendarWrap">
        <span class="cd-label" data-i18n="form.calendar"></span>
        <div class="cd-seg" id="fCalendar">
          <button type="button" data-v="solar" data-i18n="form.solar"></button>
          <button type="button" data-v="lunar" data-i18n="form.lunar"></button>
        </div>
      </div>

      <label class="cd-field" id="fSolarWrap">
        <span class="cd-label" data-i18n="form.date"></span>
        <input class="cd-input" id="fDate" type="date">
      </label>

      <div class="cd-field" id="fLunarWrap" hidden>
        <span class="cd-label" data-i18n="form.lunarDate"></span>
        <div class="cd-lunar-row">
          <select class="cd-select" id="fLY" aria-label="农历年" data-i18n-aria="form.lunarYear"></select>
          <select class="cd-select" id="fLM" aria-label="农历月" data-i18n-aria="form.lunarMonth"></select>
          <select class="cd-select" id="fLD" aria-label="农历日" data-i18n-aria="form.lunarDay"></select>
        </div>
        <label class="cd-check" id="fLeapWrap">
          <input type="checkbox" id="fLeap">
          <span data-i18n="form.leap"></span>
        </label>
        <p class="cd-hint" id="fLunarPreview"></p>
      </div>

      <div class="cd-field" id="fRepeatWrap">
        <span class="cd-label" data-i18n="form.countdown"></span>
        <div class="cd-switch-row">
          <span data-i18n="form.repeat"></span>
          <label class="cd-switch">
            <input type="checkbox" id="fRepeat">
            <i></i>
          </label>
        </div>
        <p class="cd-hint" id="fRepeatHint" data-i18n="form.repeatHint"></p>
      </div>

      <div class="cd-field" id="fRemindWrap">
        <span class="cd-label" data-i18n="form.remind"></span>
        <div class="cd-switch-row">
          <span data-i18n="form.remindTask"></span>
          <label class="cd-switch">
            <input type="checkbox" id="fTask">
            <i></i>
          </label>
        </div>
        <div class="cd-switch-row">
          <span data-i18n="form.remindSnack"></span>
          <label class="cd-switch">
            <input type="checkbox" id="fSnack">
            <i></i>
          </label>
        </div>
        <div class="cd-days" id="fOffsets">
          <button type="button" data-d="0" aria-pressed="false" data-i18n="offset.0"></button>
          <button type="button" data-d="1" aria-pressed="false" data-i18n="offset.1"></button>
          <button type="button" data-d="3" aria-pressed="false" data-i18n="offset.3"></button>
          <button type="button" data-d="7" aria-pressed="false" data-i18n="offset.7"></button>
          <button type="button" data-d="30" aria-pressed="false" data-i18n="offset.30"></button>
        </div>
        <p class="cd-hint" id="fRemindHint"></p>
      </div>

      <div class="cd-field" id="fArchiveWrap">
        <span class="cd-label" data-i18n="form.archive"></span>
        <div class="cd-switch-row">
          <span data-i18n="form.archiveMove"></span>
          <label class="cd-switch">
            <input type="checkbox" id="fArchived">
            <i></i>
          </label>
        </div>
        <p class="cd-hint" data-i18n="empty.archiveHint"></p>
      </div>

      <div class="cd-field" id="fColorWrap">
        <span class="cd-label" data-i18n="form.color"></span>
        <div class="cd-colors" id="fColors"></div>
      </div>

      <label class="cd-field">
        <span class="cd-label" data-i18n="form.note"></span>
        <textarea class="cd-textarea" id="fNote" rows="2" maxlength="200" placeholder=""
                  data-i18n-ph="form.notePh"></textarea>
      </label>

      <button type="button" class="cd-danger" id="cdDelete" hidden data-i18n="form.delete"></button>
    </div>
  </div>
</div>

<div id="cdSetLayer" hidden>
  <div class="cd-mask" id="cdSetMask"></div>
  <div class="cd-sheet" role="dialog" aria-modal="true" aria-labelledby="cdSetTitle">
    <div class="cd-sheet-head">
      <button type="button" id="cdSetClose" data-i18n="close"></button>
      <h2 id="cdSetTitle" data-i18n="settings"></h2>
      <span class="cd-head-spacer" aria-hidden="true"></span>
    </div>
    <div class="cd-sheet-body">

      <div class="cd-field">
        <span class="cd-label" data-i18n="lang"></span>
        <!-- 按钮由 app.js 按已注册的语言包生成：加一个语言包就多一个选项 -->
        <div class="cd-seg" id="sLang"></div>
      </div>

      <div class="cd-field">
        <span class="cd-label" data-i18n="set.hero"></span>
        <div class="cd-switch-row">
          <span data-i18n="set.heroToggle"></span>
          <label class="cd-switch">
            <input type="checkbox" id="sHero">
            <i></i>
          </label>
        </div>
        <p class="cd-hint" data-i18n-html="set.heroHint"><b>当前分区</b>排在最前的那一条；关掉则列表直接贴顶，一屏能多看几条。</p>
      </div>

      <div class="cd-field">
        <span class="cd-label" data-i18n="set.data"></span>
        <p class="cd-hint" id="sDataInfo"></p>
        <button type="button" class="cd-danger" id="sClear" data-i18n="set.clear"></button>
        <p class="cd-hint" data-i18n-html="set.clearHint"><b>不会</b>影响应用里的其他任务与项目。</p>
      </div>

      <div class="cd-field">
        <span class="cd-label" data-i18n="set.about"></span>
        <!-- 版本号由 app.js 按清单版本填入；作者与反馈地址是固定信息，直接写在模板里 -->
        <div class="cd-about">
          <p class="cd-about-row cd-about-row--ver" id="sAbout"></p>
          <p class="cd-about-row">
            <span class="cd-about-k" data-i18n="about.author"></span>
            <span class="cd-about-v">calmpunct</span>
          </p>
          <p class="cd-about-row">
            <span class="cd-about-k" data-i18n="about.feedback"></span>
            <!-- 外链只用于跳转，不加载任何外部资源；target/rel 避免把插件视图本身导航走 -->
            <a class="cd-about-v cd-about-link"
               href="https://github.com/calmpunct/sp-milestone/issues"
               target="_blank" rel="noopener noreferrer">github.com/calmpunct/sp-milestone/issues</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="cd-toast" id="cdToast" role="status" aria-live="polite"></div>

<!-- 列表里的提醒铃铛：图标只定义一次，每条记录用 <use> 引用，省掉每条重复的路径数据 -->
<svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true" focusable="false">
  <symbol id="cd-bell-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
    <path d="M13.7 21a2 2 0 01-3.4 0"/>
  </symbol>
</svg>

<script>
/*INJECT_SCRIPTS*/
</script>
</body>
</html>
